stages:
  - build
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  REVIVE_RELEASE_DIR: "$CI_PROJECT_DIR/releases"
  REVIVE_RELEASE_NAME: "ReviveEmu-server_v34-prod"

reviveemu:prod:server-v34:
  stage: build
  image: debian:12-slim
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates
      build-essential
      cmake
      ninja-build
      file
      git
      binutils
      patchelf
      gcc-multilib
      g++-multilib
    - rm -rf /var/lib/apt/lists/*
  script:
    - test -f releases/build-prod.sh || { echo "releases/build-prod.sh is missing from Git" >&2; exit 1; }
    - test -f releases/server_v34/cleanup-old-emulators.sh || { echo "release template is missing" >&2; exit 1; }
    - chmod +x releases/build-prod.sh releases/server_v34/cleanup-old-emulators.sh
    - REVIVE_LEGACY_MILESTONE="prod-${CI_COMMIT_SHORT_SHA}" releases/build-prod.sh
    - test -s releases/ReviveEmu-server_v34-prod.tar.gz
    - test -s releases/ReviveEmu-server_v34-prod.tar.gz.sha256
  artifacts:
    name: "reviveemu-server-v34-prod-${CI_COMMIT_SHORT_SHA}"
    when: on_success
    expire_in: 30 days
    paths:
      - releases/ReviveEmu-server_v34-prod/
      - releases/ReviveEmu-server_v34-prod.tar.gz
      - releases/ReviveEmu-server_v34-prod.tar.gz.sha256

reviveemu:release:server-v34:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  interruptible: false
  needs:
    - job: reviveemu:prod:server-v34
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - test -s releases/ReviveEmu-server_v34-prod.tar.gz
    - test -s releases/ReviveEmu-server_v34-prod.tar.gz.sha256
    - RELEASE_TAG="0.0.${CI_PIPELINE_IID}"
    - RELEASE_TITLE="ReviveEmu server_v34 prod ${RELEASE_TAG}"
    - unset GITLAB_TOKEN GITLAB_ACCESS_TOKEN OAUTH_TOKEN || true
    - >-
      printf '%s\n'
      "# ${RELEASE_TITLE}"
      ""
      "ReviveEmu production build for server_v34."
      ""
      "- GitLab commit: ${CI_COMMIT_SHA}"
      "- GitLab pipeline: ${CI_PIPELINE_URL}"
      "- Platform: Linux x86/i386"
      > release-notes.md
    - >-
      glab release create "$RELEASE_TAG"
      releases/ReviveEmu-server_v34-prod.tar.gz
      releases/ReviveEmu-server_v34-prod.tar.gz.sha256
      --name "$RELEASE_TITLE"
      --notes-file release-notes.md
      --ref "$CI_COMMIT_SHA"
      --package-name "reviveemu-server-v34"
      --use-package-registry
    - glab release view "$RELEASE_TAG"
    - echo "GitLab Release ${RELEASE_TAG} published successfully."
