stages:
  - build
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  REVIVE_RELEASE_DIR: "$CI_PROJECT_DIR/releases"
  REVIVE_RELEASE_NAME: "ReviveEmu-server_v34-prod"

reviveemu:prod:server-v34:
  stage: build
  image: debian:12-slim
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates
      build-essential
      cmake
      ninja-build
      file
      git
      binutils
      patchelf
      gcc-multilib
      g++-multilib
    - rm -rf /var/lib/apt/lists/*
  script:
    - chmod +x releases/build-prod.sh releases/server_v34/cleanup-old-emulators.sh
    - REVIVE_LEGACY_MILESTONE="prod-${CI_COMMIT_SHORT_SHA}" releases/build-prod.sh
  artifacts:
    name: "reviveemu-server-v34-prod-${CI_COMMIT_SHORT_SHA}"
    when: on_success
    expire_in: 30 days
    paths:
      - releases/ReviveEmu-server_v34-prod/
      - releases/ReviveEmu-server_v34-prod.tar.gz

reviveemu:release:server-v34:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  interruptible: false
  needs:
    - job: reviveemu:prod:server-v34
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - test -s releases/ReviveEmu-server_v34-prod.tar.gz
    - RELEASE_TAG="0.0.${CI_PIPELINE_IID}"
    - RELEASE_TITLE="ReviveEmu server_v34 prod ${CI_COMMIT_SHORT_SHA}"
    - >-
      glab release create "$RELEASE_TAG"
      "releases/ReviveEmu-server_v34-prod.tar.gz#ReviveEmu server_v34 Linux i386#package"
      --repo "$CI_PROJECT_PATH"
      --ref "$CI_COMMIT_SHA"
      --name "$RELEASE_TITLE"
      --notes "Production Linux i386 package for CS:S V34 / Build 4100. Commit: ${CI_COMMIT_SHA}. Pipeline: ${CI_PIPELINE_URL}."
      --use-package-registry
      --package-name "reviveemu-server-v34"
