[Emulator]

# Set to True to enable loading applications/content from GCF files.
# Default: False
CacheEnabled=False

# Directory containing GCF files.
# Used only when CacheEnabled=True.
#CachePath=/opt/steam/gcf

# Optional raw Content Description Record blob.
# By default ReviveEmu looks for cdr.bin next to rev.ini.
#CDRPath=cdr.bin

# Legacy Steam language used for localized content/cache requirements.
# Examples: English, French, Italian, German, Spanish, sChinese,
# Korean, Koreana, tChinese, Japanese, Russian, Thai, Portuguese
# Default: English
Language=English

# Enable classic ReviveEmu log output (rev.log).
# Default: False
Logging=False

# Emulated legacy Steam username.
# Default: RevUser
SteamUser=RevUser

# Compatibility behavior for very old engine builds.
# Possible values: None, 2003
# Default: None
CompatibilityMode=None

# Reject unknown/non-Revive tickets in the classic validator path.
# Default: False
ForceRevClient=False

[Log]

# Extra log groups. Effective when Logging=True.
FileSystem=False
Account=False
UserID=False
