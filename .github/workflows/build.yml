name: ReviveEmu Linux x86 build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-linux-x86:
    name: Linux x86/i386
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install x86 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 cmake ninja-build

      - name: Configure
        shell: bash
        working-directory: Steam/steam
        run: |
          cmake -S . -B ./build -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DCMAKE_SHARED_LINKER_FLAGS="-m32"

      - name: Build
        shell: bash
        working-directory: Steam/steam
        run: cmake --build ./build

      - name: Run tests
        shell: bash
        working-directory: Steam/steam
        run: ctest --test-dir ./build --output-on-failure
