name: ReviveEmu Linux x86 production

on:
  push:
    branches:
      - prod
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86:
    name: Linux x86/i386
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install x86 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            file \
            git \
            binutils \
            patchelf \
            gcc-multilib \
            g++-multilib \
            curl \
            jq

      - name: Build, test and package production release
        shell: bash
        run: |
          chmod +x \
            releases/build-prod.sh \
            releases/publish-github-release.sh \
            releases/server_v34/cleanup-old-emulators.sh

          REVIVE_LEGACY_MILESTONE="prod-${GITHUB_SHA::7}" \
            releases/build-prod.sh

          test -s releases/ReviveEmu-server_v34-prod.tar.gz
          test -s releases/ReviveEmu-server_v34-prod.tar.gz.sha256

      - name: Store CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviveemu-server-v34-prod-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            releases/ReviveEmu-server_v34-prod/
            releases/ReviveEmu-server_v34-prod.tar.gz
            releases/ReviveEmu-server_v34-prod.tar.gz.sha256

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RELEASE_TAG: 0.0.${{ github.run_number }}
          GITHUB_RELEASE_TITLE: ReviveEmu server_v34 prod 0.0.${{ github.run_number }}
        run: |
          releases/publish-github-release.sh
