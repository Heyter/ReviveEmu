name: ReviveEmu Linux build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: "Linux 32-bit"
            gccflags: "-m32"
          - name: "Linux 64-bit"
            gccflags: "-m64"

    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        if: matrix.name == 'Linux 32-bit'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

      - name: Run CMake
        shell: bash
        working-directory: Steam/steam
        run: cmake -B ./build -DCMAKE_C_FLAGS="${{ matrix.gccflags }}" -DCMAKE_CXX_FLAGS="${{ matrix.gccflags }}"

      - name: Build
        shell: bash
        working-directory: Steam/steam
        run: cmake --build ./build

      - name: Run legacy ABI smoke tests
        shell: bash
        working-directory: Steam/steam
        run: ctest --test-dir ./build --output-on-failure
